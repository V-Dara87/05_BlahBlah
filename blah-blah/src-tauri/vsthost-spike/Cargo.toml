[package]
name = "vsthost-spike"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Phase 0 spike proving VST3 effect hosting for BlahBlah"
license = "MIT OR Apache-2.0"
publish = false

# Standalone: never part of the Tauri app workspace.
[workspace]

[dependencies]
truce-rack = { version = "1.1", default-features = false, features = ["vst3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
